schema_version: "2.0.0"
registry_id: "laboris-statutory-sources"

sources:
  legco_bills_odata:
    name: "香港立法會法案資料庫"
    type: "odata"
    base_url: "https://app.legco.gov.hk/BillsDB/odata/V1"
    endpoint: "/Bills"
    evidence_level: "official_statute"
    parser: "odata_bills"
    schedule_cron: "0 0 * * 1-5"
    timeout_sec: 15
    is_mock: true

  labour_press_webdiff:
    name: "勞工處新聞發布 (Web Diff)"
    type: "html_diff"
    base_url: "https://www.labour.gov.hk/tc/news/press.htm"
    evidence_level: "official_gazette"
    parser: "html_semantic"
    schedule_cron: "0 */4 * * *"
    timeout_sec: 15
    is_mock: true

  legco_manpower_pdf:
    name: "立法會人力事務委員會討論文件 (PDF)"
    type: "pdf_stream"
    base_url: "https://www.legco.gov.hk/yr2026/chinese/panels/mp/papers/sample.pdf"
    evidence_level: "official_committee_paper"
    parser: "pdf_layout_aware"
    schedule_cron: "0 2 * * *"
    timeout_sec: 30
    is_mock: true
